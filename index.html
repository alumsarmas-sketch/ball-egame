<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ball-E - Cyber Neon Puzzle</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;0,700;0,900;1,900&display=swap');

        :root {
            --c-bg: #03050a;
            --c-grid: rgba(0, 243, 255, 0.05);
            --c-blue: #00f3ff;
            --c-pink: #ff00ea;
            --c-green: #39ff14;
            --c-yellow: #fffb00;
            --c-red: #ff2a2a;
            --c-orange: #ff8c00;
            --font-main: 'Poppins', sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--c-bg);
            font-family: var(--font-main);
            color: white;
            overflow: hidden;
            user-select: none;
        }

        /* Glassmorphism Utilities */
        .glass {
            background: rgba(10, 15, 25, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        
        .glass-panel { border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1); }

        /* Glowing Text & Icons */
        .glow-text-blue { text-shadow: 0 0 10px var(--c-blue), 0 0 20px var(--c-blue); }
        .glow-text-pink { text-shadow: 0 0 10px var(--c-pink), 0 0 20px var(--c-pink); }
        .glow-text-green { text-shadow: 0 0 10px var(--c-green), 0 0 20px var(--c-green); }
        .glow-text-red { text-shadow: 0 0 10px var(--c-red), 0 0 20px var(--c-red); }

        /* Tools Sidebar */
        .tool-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .tool-btn:hover:not(.active) { background: rgba(255,255,255,0.05); transform: translateX(5px); }
        .tool-btn.active[data-tool="trampoline"] { border-color: var(--c-green); background: rgba(57,255,20,0.1); box-shadow: 0 0 20px rgba(57,255,20,0.2); }
        .tool-btn.active[data-tool="platform"] { border-color: var(--c-orange); background: rgba(255,140,0,0.1); box-shadow: 0 0 20px rgba(255,140,0,0.2); }
        .tool-btn.active[data-tool="gas"] { border-color: var(--c-pink); background: rgba(255,0,234,0.1); box-shadow: 0 0 20px rgba(255,0,234,0.2); }
        .tool-btn.active[data-tool="gravity"] { border-color: var(--c-blue); background: rgba(0,243,255,0.1); box-shadow: 0 0 20px rgba(0,243,255,0.2); }

        /* Canvas Wrapper */
        #game-canvas {
            position: absolute; top: 0; left: 0; z-index: 0;
            width: 100%; height: 100%;
            cursor: crosshair;
        }

        /* Screen Overlays */
        .overlay {
            position: absolute; inset: 0; z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            opacity: 1; transition: opacity 0.3s;
        }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        
        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* Buttons */
        .btn-neon {
            position: relative; overflow: hidden; transition: all 0.3s;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 900;
        }
        .btn-neon:hover { transform: scale(1.05); }
        .btn-neon:active { transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col h-screen w-screen">

    <!-- Canvas Background Layer -->
    <canvas id="game-canvas"></canvas>

    <!-- Top UI Bar -->
    <div class="h-20 glass z-10 flex items-center justify-between px-8 border-b border-white/10 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-4xl font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-[var(--c-blue)] to-[var(--c-pink)] drop-shadow-[0_0_15px_rgba(0,243,255,0.5)]">BALL-E</h1>
        </div>

        <!-- HUD Center: Phase & Timer -->
        <div class="flex items-center gap-8 glass-panel px-6 py-2 bg-black/40">
            <div id="phase-indicator" class="flex items-center gap-2 text-[var(--c-blue)] glow-text-blue font-bold tracking-widest uppercase">
                <i class="fa-solid fa-hammer"></i> <span>Construcción</span>
            </div>
            <div class="w-px h-8 bg-white/20"></div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-stopwatch text-2xl text-[var(--c-yellow)] glow-text-yellow"></i>
                <span id="main-timer" class="text-3xl font-black text-[var(--c-yellow)] w-20 text-center font-mono">60.0</span>
            </div>
        </div>

        <div class="flex gap-4">
            <button id="btn-action" class="btn-neon px-8 py-3 bg-[var(--c-green)] text-black rounded-lg shadow-[0_0_20px_rgba(57,255,20,0.4)]">
                <i class="fa-solid fa-play mr-2"></i> INICIAR (ESPACIO)
            </button>
            <button id="btn-reset-level" class="btn-neon px-5 py-3 bg-white/10 text-white rounded-lg hover:bg-white/20 border border-white/20">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex-1 flex relative pointer-events-none">
        
        <!-- Sidebar -->
        <div class="w-80 glass z-10 flex flex-col pointer-events-auto border-r border-white/10">
            <div class="p-5 border-b border-white/5 bg-black/40">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">Herramientas</h2>
                <div class="text-xs text-gray-400 space-y-1.5 font-medium bg-white/5 p-3 rounded-lg border border-white/10">
                    <p><i class="fa-solid fa-mouse-pointer text-[var(--c-blue)] w-4"></i> Click Izq: Colocar / Usar</p>
                    <p><i class="fa-solid fa-eraser text-[var(--c-red)] w-4"></i> Click Der: Borrar Pieza</p>
                    <p><i class="fa-solid fa-rotate text-white w-4"></i> Rueda Mouse: Rotar</p>
                    <p><i class="fa-solid fa-hand text-[var(--c-yellow)] w-4"></i> Rueda Click: Mover Cámara</p>
                </div>
            </div>

            <div class="p-4 flex flex-col gap-3 overflow-y-auto" id="tool-container">
                <button class="tool-btn active flex items-center gap-4 p-3 rounded-xl bg-black/50" data-tool="trampoline">
                    <div class="w-14 h-14 rounded-lg bg-[var(--c-green)]/10 border border-[var(--c-green)] flex items-center justify-center text-[var(--c-green)] text-2xl shadow-[0_0_15px_rgba(57,255,20,0.2)] shrink-0">
                        <i class="fa-solid fa-angles-up"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white tracking-wide">Trampolín</div>
                        <div class="text-xs text-gray-400 leading-tight mt-1">Rebote direccional intenso.</div>
                    </div>
                </button>

                <button class="tool-btn flex items-center gap-4 p-3 rounded-xl bg-black/50" data-tool="platform">
                    <div class="w-14 h-14 rounded-lg bg-[var(--c-orange)]/10 border border-[var(--c-orange)] flex items-center justify-center text-[var(--c-orange)] text-2xl shadow-[0_0_15px_rgba(255,140,0,0.2)] shrink-0">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white tracking-wide">Plataforma</div>
                        <div class="text-xs text-gray-400 leading-tight mt-1">Bloque sólido básico.</div>
                    </div>
                </button>

                <button class="tool-btn flex items-center gap-4 p-3 rounded-xl bg-black/50" data-tool="gas">
                    <div class="w-14 h-14 rounded-lg bg-[var(--c-pink)]/10 border border-[var(--c-pink)] flex items-center justify-center text-[var(--c-pink)] text-2xl shadow-[0_0_15px_rgba(255,0,234,0.2)] shrink-0">
                        <i class="fa-solid fa-wind"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white tracking-wide">Dispara Gas</div>
                        <div class="text-xs text-gray-400 leading-tight mt-1">Empuje remoto (3 usos). Click en SIM.</div>
                    </div>
                </button>

                <button class="tool-btn flex items-center gap-4 p-3 rounded-xl bg-black/50" data-tool="gravity">
                    <div class="w-14 h-14 rounded-lg bg-[var(--c-blue)]/10 border border-[var(--c-blue)] flex items-center justify-center text-[var(--c-blue)] text-2xl shadow-[0_0_15px_rgba(0,243,255,0.2)] shrink-0">
                        <i class="fa-solid fa-arrows-down-to-line"></i>
                    </div>
                    <div class="text-left">
                        <div class="font-bold text-white tracking-wide">Cambiagravedad</div>
                        <div class="text-xs text-gray-400 leading-tight mt-1">Alinea gravedad a la canasta.</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- Floating Zoom Controls -->
        <div class="absolute bottom-8 right-8 z-10 flex flex-col gap-3 pointer-events-auto">
            <button id="btn-zoom-in" class="w-12 h-12 rounded-full glass flex items-center justify-center text-white text-xl hover:bg-white/10 active:scale-95 transition"><i class="fa-solid fa-plus"></i></button>
            <button id="btn-zoom-reset" class="w-12 h-12 rounded-full glass flex items-center justify-center text-white text-md hover:bg-white/10 active:scale-95 transition font-bold tracking-tighter">1x</button>
            <button id="btn-zoom-out" class="w-12 h-12 rounded-full glass flex items-center justify-center text-white text-xl hover:bg-white/10 active:scale-95 transition"><i class="fa-solid fa-minus"></i></button>
        </div>

    </div>

    <!-- SCREENS -->
    <div id="screen-start" class="overlay">
        <div class="pop-in flex flex-col items-center bg-black/60 p-12 rounded-3xl border border-white/10 shadow-[0_0_50px_rgba(0,0,0,0.8)]">
            <i class="fa-solid fa-cube text-7xl text-[var(--c-blue)] mb-6 glow-text-blue"></i>
            <h1 class="text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-[var(--c-blue)] via-white to-[var(--c-pink)] mb-2 italic tracking-tighter">BALL-E</h1>
            <p class="text-gray-300 text-xl mb-10 font-light tracking-wide">Cyber-Physics Constructor</p>
            <button id="btn-initial-start" class="btn-neon px-16 py-4 bg-white text-black rounded-full text-2xl shadow-[0_0_30px_rgba(255,255,255,0.5)]">
                JUGAR AHORA
            </button>
        </div>
    </div>

    <div id="screen-result" class="overlay hidden">
        <div class="pop-in flex flex-col items-center bg-black/80 p-12 rounded-3xl border-2 border-transparent backdrop-blur-xl" id="result-modal">
            <i id="result-icon" class="fa-solid text-7xl mb-4"></i>
            <h1 id="result-title" class="text-6xl font-black mb-2 tracking-tighter">TITLE</h1>
            <p id="result-desc" class="text-xl text-gray-300 mb-8 font-medium">Description</p>
            
            <div id="result-stats" class="hidden w-full flex gap-8 mb-8 justify-center">
                <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center flex-1">
                    <div class="text-xs text-[var(--c-green)] font-bold uppercase mb-1">Tiempo SIM</div>
                    <div class="text-3xl font-black" id="stat-time">0s</div>
                </div>
                <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center flex-1">
                    <div class="text-xs text-[var(--c-blue)] font-bold uppercase mb-1">Piezas</div>
                    <div class="text-3xl font-black" id="stat-pieces">0</div>
                </div>
            </div>

            <button onclick="initLevel()" class="btn-neon px-12 py-4 bg-white text-black rounded-full text-xl shadow-[0_0_30px_rgba(255,255,255,0.3)]">
                <i class="fa-solid fa-rotate-right mr-2"></i> JUGAR DE NUEVO
            </button>
        </div>
    </div>

    <script>
        // --- System Core ---
        const Engine = Matter.Engine,
              Bodies = Matter.Bodies,
              Body = Matter.Body,
              Composite = Matter.Composite,
              Events = Matter.Events,
              Vector = Matter.Vector;

        // Custom Constants
        const WORLD_W = 3000;
        const WORLD_H = 2000;
        
        // State
        let engine;
        let gameState = 'START'; // START, BUILD, SIM, END
        let currentTool = 'trampoline';
        let ghostAngle = 0;
        
        let ball, basketSensor, redWalls = [];
        let isBasketUp = true;
        let placedTools = [];
        let particles = [];
        
        // Timers
        let timeLeft = 60.0;
        let winTimer = 0;
        let lastTimestamp = 0;
        
        // Camera & Mouse (The Custom Rendering Solution)
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let cam = { x: WORLD_W/2, y: WORLD_H/2, zoom: 0.8 };
        let mouse = { screenX: 0, screenY: 0, worldX: 0, worldY: 0, x: 0, y: 0 };
        let isPanning = false, panStart = {x:0, y:0, cx:0, cy:0};

        // Initialize Engine
        engine = Engine.create();
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Coordinate Math ---
        // Converts screen pixel to world coordinate accurately!
        function screenToWorld(sx, sy) {
            return {
                x: (sx - canvas.width/2) / cam.zoom + cam.x,
                y: (sy - canvas.height/2) / cam.zoom + cam.y
            };
        }

        // --- Core Loop ---
        function loop(timestamp) {
            requestAnimationFrame(loop);
            if(!lastTimestamp) lastTimestamp = timestamp;
            const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.05); // Cap delta time
            lastTimestamp = timestamp;

            if (gameState === 'BUILD' || gameState === 'SIM') {
                timeLeft -= dt;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    showResult('Derrota', 'TIME\'S UP!', 'El tiempo se ha agotado.', 'yellow');
                }
                document.getElementById('main-timer').innerText = timeLeft.toFixed(1);
            }

            if (gameState === 'SIM') {
                Engine.update(engine, dt * 1000); // Standard 60fps update
                checkWinCondition(dt);
            }

            updateParticles(dt);
            renderCanvas();
        }
        requestAnimationFrame(loop);

        // --- Rendering Engine ---
        function renderCanvas() {
            // Background
            ctx.fillStyle = '#03050a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Apply Camera Transform
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(cam.zoom, cam.zoom);
            ctx.translate(-cam.x, -cam.y);

            // Draw World Grid
            drawGrid();

            // Draw Red Bounds
            ctx.strokeStyle = '#ff2a2a';
            ctx.lineWidth = 20;
            ctx.shadowColor = '#ff2a2a'; ctx.shadowBlur = 40;
            ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
            ctx.shadowBlur = 0;

            // Draw Tools
            placedTools.forEach(t => drawBody(t));

            // Draw Basket Target
            if (basketSensor && gameState !== 'START') drawBasket();

            // Draw Ball
            if (ball) {
                ctx.beginPath();
                ctx.arc(ball.position.x, ball.position.y, 30, 0, Math.PI*2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
                ctx.fill(); ctx.shadowBlur = 0;
                
                // Win Ring
                if (winTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(ball.position.x, ball.position.y, 50, -Math.PI/2, -Math.PI/2 + (Math.PI*2 * (winTimer/3)));
                    ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 8;
                    ctx.shadowColor = '#39ff14'; ctx.shadowBlur = 15;
                    ctx.stroke(); ctx.shadowBlur = 0;
                }
            }

            // Draw Ghost Tool (Build Mode)
            if (gameState === 'BUILD' && currentTool && mouse.worldX > 0 && mouse.worldX < WORLD_W && mouse.worldY > 0 && mouse.worldY < WORLD_H) {
                ctx.save();
                ctx.translate(mouse.worldX, mouse.worldY);
                ctx.rotate(ghostAngle);
                ctx.globalAlpha = 0.5;
                drawToolShape(currentTool, 0, 0, 3); // 3 charges dummy
                ctx.restore();
            }

            // Draw Particles
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            });

            ctx.restore();
        }

        function drawGrid() {
            const step = 100;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for(let x=0; x<=WORLD_W; x+=step) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); }
            for(let y=0; y<=WORLD_H; y+=step) { ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); }
            ctx.stroke();
        }

        function drawBasket() {
            ctx.save();
            ctx.translate(basketSensor.position.x, basketSensor.position.y);
            
            // Text Hologram
            ctx.fillStyle = isBasketUp ? '#00f3ff' : '#ff00ea';
            ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 20;
            ctx.font = "900 60px Poppins"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.globalAlpha = 0.5 + Math.sin(Date.now()*0.005)*0.2;
            ctx.fillText(isBasketUp ? "BOCA ARRIBA" : "BOCA ABAJO", 0, isBasketUp ? 180 : -180);
            
            // Graphics
            ctx.globalAlpha = 1.0;
            const bw = 240, bh = 180, th = 30;
            ctx.fillStyle = isBasketUp ? 'rgba(0, 243, 255, 0.2)' : 'rgba(255, 0, 234, 0.2)';
            ctx.strokeStyle = isBasketUp ? '#00f3ff' : '#ff00ea';
            ctx.lineWidth = 4;
            
            ctx.beginPath();
            if(isBasketUp) {
                ctx.rect(-bw/2, bh/2 - th, bw, th); // bottom
                ctx.rect(-bw/2, -bh/2, th, bh); // left
                ctx.rect(bw/2 - th, -bh/2, th, bh); // right
            } else {
                ctx.rect(-bw/2, -bh/2, bw, th); // top
                ctx.rect(-bw/2, -bh/2, th, bh); // left
                ctx.rect(bw/2 - th, -bh/2, th, bh); // right
            }
            ctx.fill(); ctx.stroke();
            ctx.restore();
        }

        function drawBody(b) {
            ctx.save();
            ctx.translate(b.position.x, b.position.y);
            ctx.rotate(b.angle);
            drawToolShape(b.label, 0, 0, b.c_charges);
            ctx.restore();
        }

        function drawToolShape(type, x, y, charges) {
            ctx.shadowBlur = 15;
            if (type === 'trampoline') {
                ctx.fillStyle = '#39ff14'; ctx.shadowColor = '#39ff14';
                ctx.fillRect(-100, -15, 200, 30);
            } else if (type === 'platform') {
                ctx.fillStyle = '#ff8c00'; ctx.shadowColor = '#ff8c00';
                ctx.fillRect(-120, -15, 240, 30);
                // detail
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(-120, 0, 240, 2);
            } else if (type === 'gas') {
                ctx.fillStyle = charges > 0 ? '#ff00ea' : '#333'; 
                ctx.shadowColor = charges > 0 ? '#ff00ea' : 'transparent';
                ctx.fillRect(-40, -30, 80, 60);
                // Nozzle
                ctx.beginPath(); ctx.moveTo(40, -20); ctx.lineTo(70, 0); ctx.lineTo(40, 20);
                ctx.fillStyle = '#fff'; ctx.fill();
                // Charges
                ctx.fillStyle = '#000'; ctx.font = "900 24px Poppins"; ctx.textAlign = "center"; ctx.textBaseline="middle"; ctx.shadowBlur=0;
                ctx.fillText(charges || "0", 0, 0);
            } else if (type === 'gravity') {
                ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 8; ctx.shadowColor = '#00f3ff';
                ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI*2); ctx.stroke();
                // inner arrow
                ctx.fillStyle = '#00f3ff';
                ctx.beginPath(); ctx.moveTo(-20, -10); ctx.lineTo(20, -10); ctx.lineTo(0, 25); ctx.fill();
            }
        }

        // --- Gameplay Logic ---
        function initLevel() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            
            // Clean physics world
            Composite.clear(engine.world);
            Engine.clear(engine);
            placedTools = [];
            particles = [];
            engine.gravity.y = 1;
            
            createBounds();
            spawnLevelEntities();

            // Set state
            gameState = 'BUILD';
            timeLeft = 60.0;
            winTimer = 0;
            
            // UI
            updateHUDMode('BUILD');
            cam = { x: WORLD_W/2, y: WORLD_H/2, zoom: Math.min(window.innerWidth/WORLD_W, window.innerHeight/WORLD_H) * 0.9 };
        }

        function createBounds() {
            const opts = { isStatic: true, label: 'wall', restitution: 0 };
            const th = 200;
            redWalls = [
                Bodies.rectangle(WORLD_W/2, -th/2, WORLD_W, th, opts),
                Bodies.rectangle(WORLD_W/2, WORLD_H+th/2, WORLD_W, th, opts),
                Bodies.rectangle(-th/2, WORLD_H/2, th, WORLD_H, opts),
                Bodies.rectangle(WORLD_W+th/2, WORLD_H/2, th, WORLD_H, opts)
            ];
            Composite.add(engine.world, redWalls);
        }

        function spawnLevelEntities() {
            // Ball on left
            ball = Bodies.circle(300, 300, 30, { 
                label: 'ball', restitution: 0.5, friction: 0.01, density: 0.05, isStatic: true 
            });
            
            // Basket random on right
            isBasketUp = Math.random() > 0.5;
            const bX = WORLD_W - 300 - Math.random() * 400;
            const bY = 500 + Math.random() * (WORLD_H - 1000);
            
            const bw = 240, bh = 180, th = 30;
            const wOpts = { isStatic: true, label: 'basketWall' };
            let parts = [];
            if(isBasketUp) {
                parts.push(Bodies.rectangle(bX, bY+bh/2-th/2, bw, th, wOpts));
                parts.push(Bodies.rectangle(bX-bw/2+th/2, bY, th, bh, wOpts));
                parts.push(Bodies.rectangle(bX+bw/2-th/2, bY, th, bh, wOpts));
            } else {
                parts.push(Bodies.rectangle(bX, bY-bh/2+th/2, bw, th, wOpts));
                parts.push(Bodies.rectangle(bX-bw/2+th/2, bY, th, bh, wOpts));
                parts.push(Bodies.rectangle(bX+bw/2-th/2, bY, th, bh, wOpts));
            }
            
            basketSensor = Bodies.rectangle(bX, bY, bw-th*2, bh-th, { isStatic: true, isSensor: true, label: 'basketSensor' });
            
            Composite.add(engine.world, [ball, basketSensor, ...parts]);
        }

        function beginSimulation() {
            if (gameState !== 'BUILD') return;
            gameState = 'SIM';
            timeLeft = 60.0;
            Body.setStatic(ball, false);
            updateHUDMode('SIM');
        }

        function updateHUDMode(mode) {
            const indicator = document.getElementById('phase-indicator');
            const btn = document.getElementById('btn-action');
            if(mode === 'BUILD') {
                indicator.innerHTML = `<i class="fa-solid fa-hammer"></i> <span>Construcción</span>`;
                indicator.className = "flex items-center gap-2 text-[var(--c-blue)] glow-text-blue font-bold tracking-widest uppercase";
                btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i> INICIAR (ESPACIO)`;
                btn.className = "btn-neon px-8 py-3 bg-[var(--c-green)] text-black rounded-lg shadow-[0_0_20px_rgba(57,255,20,0.4)]";
            } else {
                indicator.innerHTML = `<i class="fa-solid fa-rocket animate-pulse"></i> <span>Simulación</span>`;
                indicator.className = "flex items-center gap-2 text-[var(--c-pink)] glow-text-pink font-bold tracking-widest uppercase";
                btn.innerHTML = `<i class="fa-solid fa-ban mr-2"></i> BLOQUEADO`;
                btn.className = "btn-neon px-8 py-3 bg-gray-700 text-gray-400 rounded-lg cursor-not-allowed";
            }
        }

        // --- Interaction ---
        canvas.addEventListener('mousemove', e => {
            mouse.screenX = e.clientX; mouse.screenY = e.clientY;
            const w = screenToWorld(e.clientX, e.clientY);
            mouse.worldX = w.x; mouse.worldY = w.y;
            mouse.x = w.x; mouse.y = w.y; // For Matter.js compatibility
            
            if (isPanning) {
                cam.x = panStart.cx - (mouse.screenX - panStart.x)/cam.zoom;
                cam.y = panStart.cy - (mouse.screenY - panStart.y)/cam.zoom;
                // clamp cam
                cam.x = Math.max(0, Math.min(WORLD_W, cam.x));
                cam.y = Math.max(0, Math.min(WORLD_H, cam.y));
            }
        });

        canvas.addEventListener('mousedown', e => {
            // Update immediately to ensure accurate click location
            mouse.screenX = e.clientX; mouse.screenY = e.clientY;
            const w = screenToWorld(e.clientX, e.clientY);
            mouse.worldX = w.x; mouse.worldY = w.y;
            mouse.x = w.x; mouse.y = w.y;

            if (e.button === 1) { // Middle click PAN
                isPanning = true;
                panStart = { x: mouse.screenX, y: mouse.screenY, cx: cam.x, cy: cam.y };
                return;
            }
            
            if (gameState === 'BUILD') {
                if (e.button === 0) placeTool();
                else if (e.button === 2) deleteTool();
            } else if (gameState === 'SIM') {
                if (e.button === 0) fireGas();
            }
        });
        
        window.addEventListener('mouseup', () => isPanning = false);
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        
        canvas.addEventListener('wheel', e => {
            if (gameState === 'BUILD') ghostAngle += (e.deltaY > 0 ? 1 : -1) * (Math.PI/12);
        });

        function placeTool() {
            if(mouse.worldX < 0 || mouse.worldX > WORLD_W || mouse.worldY < 0 || mouse.worldY > WORLD_H) return;
            
            let body;
            const opts = { isStatic: true, friction: 0.5, restitution: 0.1 };
            
            if(currentTool === 'trampoline') {
                opts.label = 'trampoline'; opts.restitution = 1;
                body = Bodies.rectangle(mouse.worldX, mouse.worldY, 200, 30, opts);
            } else if(currentTool === 'platform') {
                opts.label = 'platform';
                body = Bodies.rectangle(mouse.worldX, mouse.worldY, 240, 30, opts);
            } else if(currentTool === 'gas') {
                opts.label = 'gas';
                body = Bodies.rectangle(mouse.worldX, mouse.worldY, 80, 60, opts);
                body.c_charges = 3;
            } else if(currentTool === 'gravity') {
                opts.label = 'gravity'; opts.isSensor = true;
                body = Bodies.circle(mouse.worldX, mouse.worldY, 60, opts);
            }

            if(body) {
                Body.setAngle(body, ghostAngle);
                placedTools.push(body);
                Composite.add(engine.world, body);
                spawnBurst(mouse.worldX, mouse.worldY, '#fff', 10);
            }
        }

        function deleteTool() {
            const hit = placedTools.find(b => Matter.Bounds.contains(b.bounds, mouse) && Matter.Vertices.contains(b.vertices, mouse));
            if(hit) {
                spawnBurst(hit.position.x, hit.position.y, '#ff2a2a', 15);
                Composite.remove(engine.world, hit);
                placedTools = placedTools.filter(t => t !== hit);
            }
        }

        function fireGas() {
            const hit = placedTools.find(b => b.label === 'gas' && b.c_charges > 0 && Matter.Bounds.contains(b.bounds, mouse) && Matter.Vertices.contains(b.vertices, mouse));
            if(hit) {
                hit.c_charges--;
                
                const angle = hit.angle;
                const nx = hit.position.x + Math.cos(angle)*50;
                const ny = hit.position.y + Math.sin(angle)*50;
                
                // Visual Wind
                for(let i=0; i<30; i++) {
                    const spread = angle + (Math.random()-0.5) * 1.5;
                    const spd = 15 + Math.random()*20;
                    particles.push({x:nx, y:ny, vx:Math.cos(spread)*spd, vy:Math.sin(spread)*spd, life:1, decay:0.02, r: 4 + Math.random()*4, color: '#ff00ea'});
                }

                // Physics Push via cone math
                const dx = ball.position.x - hit.position.x;
                const dy = ball.position.y - hit.position.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist < 800) {
                    const ballAngle = Math.atan2(dy, dx);
                    // Angle difference
                    let diff = ballAngle - angle;
                    while(diff > Math.PI) diff -= Math.PI*2;
                    while(diff < -Math.PI) diff += Math.PI*2;
                    
                    if(Math.abs(diff) < Math.PI/4) { // 45 deg cone
                        const force = 3.5;
                        Body.applyForce(ball, ball.position, {x: Math.cos(ballAngle)*force, y: Math.sin(ballAngle)*force});
                    }
                }
            }
        }

        // --- Physics Events ---
        Events.on(engine, 'collisionStart', e => {
            if(gameState !== 'SIM') return;
            
            e.pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;
                
                // Death Walls
                if(bodyA.label === 'wall' || bodyB.label === 'wall') {
                    const other = bodyA.label === 'wall' ? bodyB : bodyA;
                    if(other.label === 'ball') {
                        spawnBurst(ball.position.x, ball.position.y, '#ff2a2a', 50);
                        Body.setPosition(ball, {x:-1000, y:-1000}); // hide
                        showResult('Derrota', 'GAME OVER', 'La pelota tocó el límite láser rojo.', 'red');
                    }
                }
                
                // Trampoline (Velocity override for perfect bounce)
                if(bodyA.label === 'trampoline' || bodyB.label === 'trampoline') {
                    const t = bodyA.label === 'trampoline' ? bodyA : bodyB;
                    const other = bodyA.label === 'trampoline' ? bodyB : bodyA;
                    if(other.label === 'ball') {
                        const normal = t.angle - Math.PI/2;
                        const pwr = 35;
                        Body.setVelocity(ball, {x: Math.cos(normal)*pwr, y: Math.sin(normal)*pwr});
                        spawnBurst(t.position.x, t.position.y, '#39ff14', 15);
                    }
                }

                // Gravity
                if(bodyA.label === 'gravity' || bodyB.label === 'gravity') {
                    const g = bodyA.label === 'gravity' ? bodyA : bodyB;
                    const other = bodyA.label === 'gravity' ? bodyB : bodyA;
                    if(other.label === 'ball') {
                        engine.gravity.y = engine.gravity.y > 0 ? -1 : 1; // Toggle gravity
                        spawnBurst(g.position.x, g.position.y, '#00f3ff', 40);
                        Composite.remove(engine.world, g);
                        placedTools = placedTools.filter(t => t !== g);
                    }
                }
            });
        });

        function checkWinCondition(dt) {
            if(Matter.Collision.collides(ball, basketSensor)) {
                winTimer += dt;
                if(winTimer >= 3.0) {
                    showResult('Victoria', 'MASTER OF BALLS!', '¡Simulación completada con éxito!', 'green');
                }
            } else {
                winTimer = 0;
            }
            
            // Stationary fail
            if(Vector.magnitude(ball.velocity) < 0.1 && winTimer === 0) {
                // simple hack, assume it's stuck somewhere. But let's avoid false positives. 
                // A better approach is checking if it's asleep or resting for too long.
            }
        }

        // --- Particles ---
        function spawnBurst(x, y, color, count) {
            for(let i=0; i<count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 15 + 5;
                particles.push({x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 1, decay: 0.03, r: Math.random()*5+2, color});
            }
        }
        function updateParticles(dt) {
            for(let i = particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= p.decay;
                if(p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- UI Flow ---
        function showResult(type, title, desc, color) {
            gameState = 'END';
            const scr = document.getElementById('screen-result');
            const mod = document.getElementById('result-modal');
            const icon = document.getElementById('result-icon');
            
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-desc').innerText = desc;
            
            mod.className = `pop-in flex flex-col items-center bg-black/80 p-12 rounded-3xl border-2 backdrop-blur-xl border-${color}-500 shadow-[0_0_60px_rgba(var(--c-${color}),0.4)]`;
            
            if(type === 'Victoria') {
                icon.className = `fa-solid fa-trophy text-7xl mb-4 text-[var(--c-green)] glow-text-green`;
                document.getElementById('result-title').className = `text-6xl font-black mb-2 tracking-tighter text-[var(--c-green)] glow-text-green`;
                document.getElementById('result-stats').classList.remove('hidden');
                document.getElementById('stat-time').innerText = (60.0 - timeLeft).toFixed(1) + 's';
                document.getElementById('stat-pieces').innerText = placedTools.length;
            } else {
                icon.className = `fa-solid fa-skull text-7xl mb-4 text-[var(--c-${color})] glow-text-${color}`;
                document.getElementById('result-title').className = `text-6xl font-black mb-2 tracking-tighter text-[var(--c-${color})] glow-text-${color}`;
                document.getElementById('result-stats').classList.add('hidden');
            }
            
            scr.classList.remove('hidden');
        }

        // Binds
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if(gameState !== 'BUILD') return;
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
            });
        });

        document.getElementById('btn-action').addEventListener('click', () => { if(gameState === 'BUILD') beginSimulation(); });
        document.getElementById('btn-reset-level').addEventListener('click', initLevel);
        document.getElementById('btn-initial-start').addEventListener('click', initLevel);
        
        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && gameState === 'BUILD') { e.preventDefault(); beginSimulation(); }
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => cam.zoom = Math.min(2.5, cam.zoom + 0.2));
        document.getElementById('btn-zoom-out').addEventListener('click', () => cam.zoom = Math.max(0.2, cam.zoom - 0.2));
        document.getElementById('btn-zoom-reset').addEventListener('click', () => cam.zoom = 0.8);

    </script>
</body>
</html>
